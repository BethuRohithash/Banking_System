spring:
  application:
    name: gatewayserver
  main:
    allow-circular-references: true
  cloud:
    gateway:
      routes:
        - id: accounts-service
          uri: lb://ACCOUNTS
          predicates:
            - Path=/accounts/**
          filters:
            - StripPrefix=1
        - id: customers-service
          uri: lb://CUSTOMERS
          predicates:
            - Path=/customers/**
          filters:
            - StripPrefix=1
        - id: transactions-service
          uri: lb://TRANSACTIONS
          predicates:
            - Path=/transactions/**
          filters:
            - StripPrefix=1
      discovery:
        locator:
          enabled: true
server:
  port: 8073
eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
springdoc:
  swagger-ui:
    urls:
    - name: accounts
      url: /accounts/v3/api-docs
    - name: customers
      url: /customers/v3/api-docs
    - name: transactions
      url: /transactions/v3/api-docs
